id: self-signed-ssl

info:
  name: Self Signed SSL Certificate
  author: Flawfence
  severity: low
  description: |
    self-signed certificates are public key certificates that are not issued by a certificate authority. These self-signed
    certificates are easy to make and do not cost money. However, they do not provide any trust value.
  remediation: |
    Purchase or generate a proper SSL certificate for this service.
  reference:
    - https://www.rapid7.com/db/vulnerabilities/ssl-self-signed-certificate/
  metadata:
    max-request: 1
  tags: ssl,tls,self-signed,vuln

ssl:
  - address: "{{Host}}:{{Port}}"
    matchers:
      - type: dsl
        dsl:
          - "self_signed == true"
          # Skip raw-IP targets: when the input is an IP, `Host` (input) equals
          # the resolved `ip`. A self-signed cert on an IP-only endpoint has
          # no hostname identity to protect, so it's not actionable.
          - "Host != ip"
        condition: and

    extractors:
      - type: dsl
        dsl:
          - '"Subject: " + subject_dn'
          - '"Issuer: " + issuer_dn'
          - '"Validity: " + not_before + " -> " + not_after'
          - '"Serial: " + serial'
