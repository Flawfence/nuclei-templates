id: basic-auth-default-login

info:
  name: Basic Auth Default Password
  author: Flawfence
  severity: medium
  description: |
    This template attempts to fuzz default passwords on a Basic Authentication-protected endpoint.
    It first checks if Basic Authentication is available on the endpoint and then tries to authenticate using a payload list of common default passwords.
  tags: auth,default-login

flow: http(1) && http(2)

http:
  - id: check-basic-auth
    raw:
      - |
        GET / HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: status
        status:
          - 401
        internal: true

      - type: regex
        regex:
          - 'Www-Authenticate: Basic realm=".*"'
        internal: true

    extractors:
      - type: regex
        name: basic_realm
        regex:
          - 'Www-Authenticate: Basic realm="(.*?)"'
        internal: true

  - id: fuzz-basic-auth
    raw:
      - |
        GET / HTTP/1.1
        Host: {{Hostname}}
        Authorization: Basic {{base64(username + ":" + password)}}

    attack: clusterbomb
    payloads:
      username:
        - username
        - admin
        - root
        - user
        - guest
        - test
        - administrator
        - manager
        - supervisor
        - support
        - operator
        - sysadmin
        - demo
        - info
        - webmaster
        - security
        - backup
        - developer
        - service
        - monitor
        - maint
        - default
        - api
        - ftp
        - db
        - postgres
        - mysql
        - oracle
        - netadmin
        - staff
        - sales
        - cisco
        - public
        - anonymous
      password:
