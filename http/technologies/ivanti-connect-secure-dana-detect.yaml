id: ivanti-connect-secure-dana-detect

info:
  name: Ivanti Connect Secure (Pulse Connect Secure) - Detect via dana-na
  author: Flawfence
  severity: info
  description: |
    Ivanti Connect Secure / Pulse Connect Secure SSL-VPN was detected through the
    /dana-na/ authentication path and the welcome.cgi?p=logo endpoint. This detection
    complements ivanti-connect-secure-panel, which relies on the default
    "Ivanti Connect Secure" HTML title and therefore misses customized or older
    portals (such as those still branded "Pulse") that do not expose that title.
  reference:
    - https://www.ivanti.com/products/connect-secure-vpn
  classification:
    cpe: cpe:2.3:a:ivanti:connect_secure:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: ivanti
    product: connect_secure
    shodan-query: 'html:"welcome.cgi?p=logo"'
  tags: tech,ivanti,pulse,vpn,connectsecure,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/dana-na/auth/url_default/welcome.cgi"

    matchers-condition: or
    matchers:
      - type: word
        part: header
        words:
          - 'DSSIGNIN='
          - 'DSLastAccess='
        condition: or

      - type: regex
        part: header
        regex:
          - '(?i)location:\s*(?:https?://[a-z0-9._-]+)?/dana-na/auth/'

      - type: word
        part: body
        words:
          - 'welcome.cgi?p=logo'
          - 'DSSignInScript'
        condition: or
