id: 3cx-webclient-detect

info:
  name: 3CX Web Client - Detect
  author: Flawfence
  severity: info
  description: |
    3CX Phone System Web Client was detected at the web root. This complements
    3cx-phone-webclient-management-panel (which only probes /webclient/) by matching
    deployments that serve the client at / - for example behind an nginx reverse proxy
    - which the /webclient/ path check misses.
  reference:
    - https://www.3cx.com/phone-system/
    - https://www.3cx.com/blog/unified-communications/client-apps/
  classification:
    cpe: cpe:2.3:a:3cx:3cx:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: 3cx
    product: 3cx
    shodan-query: 'http.title:"3CX Webclient"'
  tags: tech,3cx,voip,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    matchers-condition: or
    matchers:
      - type: word
        part: body
        words:
          - '<title>3CX Webclient</title>'
          - '<meta name="description" content="3CX">'
        condition: or

      - type: word
        part: header
        words:
          - 'downloads-global.3cx.com'
