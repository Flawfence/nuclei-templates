id: 3cx-webclient-detect

info:
  name: 3CX Web Client - Detect
  author: Flawfence
  severity: info
  description: |
    3CX Phone System Web Client was detected. This complements
    3cx-phone-webclient-management-panel by also matching deployments that serve the
    web client at the web root (for example behind an nginx reverse proxy) rather than
    under /webclient/.
  reference:
    - https://www.3cx.com/phone-system/
    - https://www.3cx.com/blog/unified-communications/client-apps/
  classification:
    cpe: cpe:2.3:a:3cx:3cx:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    vendor: 3cx
    product: 3cx
    shodan-query: 'http.title:"3CX Webclient"'
  tags: tech,3cx,voip,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/"
      - "{{BaseURL}}/webclient/"

    stop-at-first-match: true

    matchers-condition: or
    matchers:
      - type: word
        part: body
        words:
          - '<title>3CX Webclient</title>'
          - '<meta name="description" content="3CX">'
        condition: or

      - type: word
        part: header
        words:
          - 'downloads-global.3cx.com'
