id: glpi-api-doc-exposed

info:
  name: GLPI REST API Documentation - Exposed
  author: flawfence
  severity: info
  description: |
    The GLPI REST API documentation page (apirest.php/) is served unauthenticated
    and renders the full API reference. Beyond confirming the API is enabled, it
    discloses the complete list of available endpoints and parameters to an
    attacker, easing exploitation of API authentication / injection issues.
    Restrict apirest.php to trusted networks if the API is for internal use only.
  reference:
    - https://github.com/glpi-project/glpi/blob/main/apirest.md
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:glpi-project:glpi:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    vendor: glpi-project
    product: glpi
  tags: glpi,api,exposure,glpi-project,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/apirest.php/"
      - "{{BaseURL}}/glpi/apirest.php/"

    stop-at-first-match: true
    extractors:
      - type: regex
        name: api_doc_title
        part: body
        group: 1
        regex:
          - '(<title>[^<]*API[^<]*GLPI[^<]*</title>)'
          - '(<title>[^<]*GLPI[^<]*API[^<]*</title>)'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "API - GLPI"
          - "apirest"
          - "initSession"
          - "Documentation de l"
        condition: or

      - type: word
        part: body
        words:
          - "GLPI"

      - type: status
        status:
          - 200
