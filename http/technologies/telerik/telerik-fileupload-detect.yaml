id: telerik-fileupload-detect

info:
  name: Detect Telerik Web UI Fileupload Handler
  author: Flawfence
  severity: critical
  description: This template detects the Telerik Web UI fileupload handler. Several vulnerabilities exist in this component, including arbitrary file upload and remote code execution. Several Proof-of-concept exploit exist for a .NET JSON deserialization vulnerability in Telerik UI for ASP.NET AJAX allowing remote code execution.
  reference:
    - https://github.com/noperator/CVE-2019-18935
    - https://medium.com/@Whyte_/remote-code-execution-rce-via-telerik-radasyncupload-rau-function-exploit-6a4555bae19a
    - https://bishopfox.com/blog/cve-2019-18935-remote-code-execution-in-telerik-ui?utm_campaign=190101_Posts_Blog&utm_source=Caleb+-+Github
  metadata:
    max-request: 1
  tags: tech,telerik,fileupload,intrusive

http:
  - method: GET
    path:
      - "{{BaseURL}}/Telerik.Web.UI.WebResource.axd?type=rau"

    matchers:
      - type: word
        words:
          - "RadAsyncUpload handler is registered succesfully"