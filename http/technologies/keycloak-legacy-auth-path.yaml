id: keycloak-legacy-auth-path

info:
  name: Legacy Keycloak (/auth Base Path, WildFly <= v16) Exposed
  author: Flawfence
  severity: low
  description: |
    Detects a legacy Keycloak deployment serving under the /auth base path. The /auth prefix
    was the default only on the WildFly-based distribution (Keycloak <= 16, removed by default
    from Keycloak 17+/Quarkus). That branch is end-of-life (16.x dates to 2021) and carries a
    large legacy CVE surface.
  remediation: |
    Migrate to a supported Quarkus-based Keycloak and drop the /auth legacy base path; never
    expose the legacy admin console to the Internet.
  reference:
    - https://www.keycloak.org/2022/02/release-highlights-17-0-0
  classification:
    cwe-id: CWE-1104
  metadata:
    max-request: 2
  tags: exposure,keycloak,legacy,eol,sso,flawfence

http:
  - method: GET
    path:
      - "{{BaseURL}}/auth/js/keycloak.js"
      - "{{BaseURL}}/auth/realms/master/.well-known/openid-configuration"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      # keycloak.js is served as JavaScript and the discovery document as JSON.
      # A catch-all host answers every path with text/html, so the content-type
      # alone rejects a reflected sign-in page served under /auth/js/keycloak.js.
      - type: word
        part: header
        words:
          - "javascript"
          - "application/json"
        condition: or

      # Structural tokens from the real adapter / discovery document. The old
      # matcher accepted a bare "keycloak", which the requested path itself
      # supplies once reflected into the body; these cannot be produced that way.
      - type: dsl
        dsl:
          - 'contains(body, "window.Keycloak") || contains(body, "createNativeAdapter") || contains(body, "openid-connect") || contains(body, "\"authorization_endpoint\"")'
