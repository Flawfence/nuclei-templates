id: glpi-status-page

info:
  name: GLPI Status Page - Detect
  author: canberbamber,flawfence
  severity: low
  description: |
    Detects an exposed, unauthenticated GLPI status.php health endpoint. Beyond
    fingerprinting GLPI, the page discloses internal infrastructure topology
    (database/replica status, configured LDAP servers, mail collectors and the
    number of running cron tasks). Matches both the legacy plaintext format
    (GLPI <= 9.x) and the JSON format introduced in GLPI 10/11.
  reference:
    - https://glpi-project.org/
    - https://buildmedia.readthedocs.org/media/pdf/glpi-user-documentation/latest/glpi-user-documentation.pdf
  classification:
    cpe: cpe:2.3:a:glpi-project:glpi:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: glpi-project
    product: glpi
    shodan-query: http.html:"glpi"
  tags: tech,status,glpi,discovery,exposure

http:
  - method: GET
    path:
      - "{{BaseURL}}/status.php"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        condition: or
        words:
          # Legacy plaintext status (GLPI <= 9.x)
          - "GLPI_DB_OK"
          - "GLPI_SESSION_DIR_OK"
          - "GLPI_OK"
          # JSON status (GLPI 10 / 11) — distinctive nested keys
          - '"crontasks"'
          - '"mail_collectors"'
          - '"session_dir"'

      - type: status
        status:
          - 200

    extractors:
      # Surface the disclosed LDAP server labels from the JSON status as evidence.
      - type: regex
        part: body
        group: 1
        regex:
          - '"servers":\s*\{\s*"([A-Za-z0-9_\-]+)"'
