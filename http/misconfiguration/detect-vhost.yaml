id: detect-vhost

info:
  name: Detect Significant Vhosts with DNS Check
  author: Flawfence
  severity: low
  description: |
    Detects virtual hosts using a wordlist and extracts significant vhosts whose
    response differs meaningfully from the base host (content-length ratio outside
    0.95-1.05). For each candidate it checks DNS: if the vhost has no A record but
    is still reachable over HTTP, it is reported as an undeclared/misconfigured vhost.

    Example:
      curl -s -H "Host: vhost.example.com" http://example.com/
  tags: vhost,http,misconfig

flow: |
  http("calibration");
  http("vhost_request");

http:
  - id: calibration
    method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: dsl
        dsl:
          - "true"
        internal: true

    extractors:
      - type: regex
        name: content_length
        part: header
        regex:
          - "Content-Length: (\\d+)"
        internal: true

  - id: vhost_request
    method: GET
    path:
      - "{{BaseURL}}"
    headers:
      Host: "{{vhost}}.{{Host}}"

    # The wordlist is loaded as a payload and iterated with battering-ram, so a
    # single http("vhost_request") call from the flow probes every entry. The
    # previous version read `variables.wordlist` (the literal path string), which
    # produced a single bogus vhost named after the wordlist file path.
    payloads:
      vhost: helpers/wordlists/vhost.txt
    attack: batteringram

    matchers-condition: and
    matchers:
      - type: status
        name: valid_status
        status:
          - 200
          - 302
        internal: true

      # Response must differ meaningfully from the base host (>5% size delta),
      # otherwise it is just the default vhost answering and not significant.
      - type: dsl
        name: significant_length
        dsl:
          - "(len(body) / to_number(calibration_content_length)) > 1.05 || (len(body) / to_number(calibration_content_length)) < 0.95"
        internal: true

      # Report only vhosts that do NOT resolve to an A record: resolve() returns
      # the address for a real host (matcher true -> negated to false -> dropped),
      # and yields nothing for an NXDOMAIN vhost (matcher false -> negated to true).
      - type: dsl
        name: no_a_record
        negative: true
        dsl:
          - "len(resolve(vhost + '.' + Host, '4')) > 0"

    extractors:
      - type: dsl
        dsl:
          - "'The vhost ' + vhost + '.' + Host + ' has no A record but is reachable via HTTP'"
