id: cors-wildcard-with-credentials

info:
  name: CORS Wildcard Origin With Credentials
  author: Flawfence
  severity: low
  description: |
    The endpoint responds with Access-Control-Allow-Origin: * together with
    Access-Control-Allow-Credentials: true. This pairing is invalid per the Fetch
    (CORS) specification - browsers refuse to expose a credentialed response when
    the allowed origin is the wildcard - so it is not directly exploitable, but it
    reveals an overly permissive, incorrectly configured CORS policy that should be
    replaced with an explicit origin allow-list. Distinct from reflected-origin CORS
    (see cors-misconfig), this matches the static wildcard case.
  reference:
    - https://portswigger.net/web-security/cors
    - https://developer.mozilla.org/en-US/docs/Web/HTTP/CORS/Errors/CORSNotSupportingCredentials
    - https://fetch.spec.whatwg.org/#http-responses
  classification:
    cwe-id: CWE-942
    cvss-metrics: CVSS:3.1/AV:N/AC:H/PR:N/UI:R/S:U/C:L/I:N/A:N
    cvss-score: 3.1
  metadata:
    max-request: 1
    verified: true
  tags: cors,misconfig,generic

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    headers:
      Origin: "https://cors-probe.flawfence.example"

    matchers:
      - type: dsl
        dsl:
          - "contains(to_lower(header), 'access-control-allow-origin: *')"
          - "contains(to_lower(header), 'access-control-allow-credentials: true')"
        condition: and

    extractors:
      - type: kval
        part: header
        kval:
          - access_control_allow_origin
          - access_control_allow_credentials
