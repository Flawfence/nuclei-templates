id: glpi-debug-mode-enabled

info:
  name: GLPI Debug Mode - Enabled
  author: flawfence
  severity: low
  description: |
    GLPI can run with "Mode debug" enabled (Setup > General > System, or
    GLPI_USE_MODE / glpi_use_mode set to development). In debug mode GLPI renders
    a debug toolbar that discloses executed SQL queries, included files, server
    globals and PHP errors to the browser. Leaving debug mode on in production is
    an operator configuration mistake that leaks sensitive internal details and
    eases further attacks. This template detects the debug toolbar / debug markers
    in served pages.
  reference:
    - https://glpi-developer-documentation.readthedocs.io/en/master/sourcecode/index.html
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
    cvss-score: 5.3
    cwe-id: CWE-489
    cpe: cpe:2.3:a:glpi-project:glpi:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    vendor: glpi-project
    product: glpi
  tags: glpi,misconfig,debug,exposure,glpi-project

http:
  - method: GET
    path:
      - "{{BaseURL}}/"
      - "{{BaseURL}}/index.php"

    stop-at-first-match: true
    extractors:
      - type: regex
        name: debug_marker
        part: body
        group: 1
        regex:
          - '("glpi_use_mode":\s*2)'
          - '(GLPI_USE_MODE\s*=\s*2)'
          - '(id="debug_[a-z0-9_]+)'
          - '(glpi_debugbar)'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "GLPI"

      - type: word
        part: body
        condition: or
        words:
          - 'id="debug_'
          - 'class="debug-floating'
          - 'GLPI DEBUG'
          - 'debugpanel'
          - 'glpi_debugbar'
          - '"glpi_use_mode":2'
          - 'GLPI_USE_MODE = 2'
          - 'displaydebug'

      - type: status
        status:
          - 200
