id: adfs-wstrust-windowstransport-ntlm

info:
  name: Microsoft AD FS WS-Trust windowstransport (NTLM) Exposed to Internet
  author: Flawfence
  severity: medium
  description: |
    The AD FS WS-Trust endpoint /adfs/services/trust/2005/windowstransport is an
    intranet-facing binding that performs Integrated Windows (NTLM) authentication.
    When it is reachable from the public Internet - typically because a Web Application
    Proxy publishes more than the intended /adfs/ls and usernamemixed endpoints - it
    exposes NTLM authentication of the backing Active Directory to the Internet,
    enabling password-spray and NTLM relay against domain accounts. Microsoft best
    practice is to keep windowstransport intranet-only.
  reference:
    - https://learn.microsoft.com/en-us/windows-server/identity/ad-fs/deployment/best-practices-securing-ad-fs
    - https://learn.microsoft.com/en-us/windows-server/identity/ad-fs/operations/configure-ad-fs-extranet-smart-lockout-protection
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
    cvss-score: 5.3
    cwe-id: CWE-284
    cpe: cpe:2.3:a:microsoft:active_directory_federation_services:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: microsoft
    product: active_directory_federation_services
    shodan-query: 'http.html:"/adfs/ls/"'
  tags: misconfig,adfs,ntlm,ws-trust,exposure,microsoft

http:
  - method: GET
    path:
      - "{{BaseURL}}/adfs/services/trust/2005/windowstransport"

    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - "WWW-Authenticate: NTLM"
        case-insensitive: true

      - type: word
        part: header
        words:
          - "Microsoft-HTTPAPI"

      - type: status
        status:
          - 401

    extractors:
      - type: kval
        part: header
        kval:
          - www_authenticate
