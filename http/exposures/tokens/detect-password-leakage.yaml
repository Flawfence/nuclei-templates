id: detect-password-leakage

info:
  name: Password or Sensitive Data Leakage
  author: Flawfence
  severity: high
  description: |
    Detects if the application leaks sensitive information such as passwords,
    password hashes, API keys, tokens, or database credentials in responses.
    Covers JSON, XML, connection strings, configuration formats, and more.
  reference:
    - https://owasp.org/www-project-top-ten/2017/A3_2017-Sensitive_Data_Exposure
    - https://cwe.mitre.org/data/definitions/359.html
    - https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html
  tags: exposure,token,generic,http,credentials,leak

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: regex
        regex:
          # JSON/JavaScript formats
          - '"password":\s*"[^"]*"'
          - '"passwd":\s*"[^"]*"'
          - '"pwd":\s*"[^"]*"'
          - '"pass":\s*"[^"]*"'
          - '"password_hash":\s*"[^"]*"'
          - '"password_digest":\s*"[^"]*"'
          - '"encrypted_password":\s*"[^"]*"'
          - '"user_password":\s*"[^"]*"'
          - '"db_password":\s*"[^"]*"'
          - '"database_password":\s*"[^"]*"'
          - '"admin_password":\s*"[^"]*"'
          - '"root_password":\s*"[^"]*"'
          - '"api_key":\s*"[^"]*"'
          - '"secret_key":\s*"[^"]*"'
          - '"access_token":\s*"[^"]*"'
          - '"refresh_token":\s*"[^"]*"'
          - '"auth_token":\s*"[^"]*"'
          - '"session_token":\s*"[^"]*"'
          - '"bearer_token":\s*"[^"]*"'
          - '"jwt":\s*"[^"]*"'
          - '"private_key":\s*"[^"]*"'
          - '"secret":\s*"[^"]*"'
          - '"recover_passw":\s*"[^"]*"'
          - '"recovery_token":\s*"[^"]*"'
          - '"reset_token":\s*"[^"]*"'
          
          # Hash patterns (common hash formats)
          - '"hash":\s*"[a-fA-F0-9]{32,}"'
          - '"md5":\s*"[a-fA-F0-9]{32}"'
          - '"sha1":\s*"[a-fA-F0-9]{40}"'
          - '"sha256":\s*"[a-fA-F0-9]{64}"'
          - '"bcrypt":\s*"\$2[ayb]\$.{56}"'
          
          # Key-value formats (config files, URL params)
          # Require value to be a simple credential (no JS code patterns like dots, parens, brackets)
          - '[?&]password=([a-zA-Z0-9_%!@#$^*+=\-]{3,})[&\s"''<]'
          - '[?&]passwd=([a-zA-Z0-9_%!@#$^*+=\-]{3,})[&\s"''<]'
          - '[?&]pwd=([a-zA-Z0-9_%!@#$^*+=\-]{3,})[&\s"''<]'
          - '[?&]pass=([a-zA-Z0-9_%!@#$^*+=\-]{3,})[&\s"''<]'
          - '[?&]api_key=([a-zA-Z0-9_%!@#$^*+=\-]{3,})[&\s"''<]'
          - '[?&]apikey=([a-zA-Z0-9_%!@#$^*+=\-]{3,})[&\s"''<]'
          - '[?&]secret=([a-zA-Z0-9_%!@#$^*+=\-]{3,})[&\s"''<]'
          
          # Database connection strings
          - 'pg_connect\('
          - 'mysql_connect\('
          - 'mysqli_connect\('
          - 'PDO\('
          - 'mongodb:\/\/[^:]+:[^@]+@'
          - 'postgres:\/\/[^:]+:[^@]+@'
          - 'mysql:\/\/[^:]+:[^@]+@'
          - 'jdbc:[^:]+:\/\/[^:]+:[^@]+@'
          - 'Server=[^;]+;.*Password=[^;]+;'
          - 'Data Source=[^;]+;.*Password=[^;]+;'
          
          # XML formats
          - '<password>[^<]+<\/password>'
          - '<passwd>[^<]+<\/passwd>'
          - '<hash>[^<]+<\/hash>'
          - '<apiKey>[^<]+<\/apiKey>'
          - '<secret>[^<]+<\/secret>'
          
          # YAML/Configuration formats (require quoted value or value of 3+ chars after whitespace)
          - 'password:\s+"[^"]{3,}"'
          - 'password:\s+''[^'']{3,}'''
          - 'passwd:\s+"[^"]{3,}"'
          - 'passwd:\s+''[^'']{3,}'''
          - 'api_key:\s+"[^"]{3,}"'
          - 'api_key:\s+''[^'']{3,}'''
          - 'secret:\s+"[^"]{3,}"'
          - 'secret:\s+''[^'']{3,}'''
          
          # Environment variables patterns (must be at start of line or after export/set)
          - '(?:^|export\s+|set\s+)PASSWORD=[^\s\n]+'
          - '(?:^|export\s+|set\s+)PASSWD=[^\s\n]+'
          - '(?:^|export\s+|set\s+)API_KEY=[^\s\n]+'
          - '(?:^|export\s+|set\s+)SECRET=[^\s\n]+'
          - '(?:^|export\s+|set\s+)DB_PASSWORD=[^\s\n]+'
          - '(?:^|export\s+|set\s+)DATABASE_PASSWORD=[^\s\n]+'
          
          # PHP serialize/unserialize
          - 's:\d+:"password";s:\d+:"[^"]+"'
          - 's:\d+:"hash";s:\d+:"[^"]+"'
          
        part: body
        condition: or

      # FALSE-POSITIVE GUARD (Flawfence): minified JS bundles embed form/field
      # *schemas* like {"password":"text", ...} where the value is an HTML input
      # type, an autocomplete token, a boolean or a masked placeholder — never an
      # actual leaked secret. RE2 (Go regexp) has no look-ahead, so we cannot
      # exclude these inline; instead this negative matcher drops the whole
      # response when a credential field's *value* is a known non-secret
      # sentinel. A real key/token value is not in this set, so genuine leaks
      # (e.g. a hardcoded API key in a bundle) are still reported.
      - type: regex
        negative: true
        part: body
        condition: or
        regex:
          - '"(?:password|passwd|pwd|pass|user_password|admin_password|root_password|db_password|database_password|encrypted_password|password_hash|password_digest|secret|secret_key|api_key|auth_token|access_token|refresh_token|session_token|bearer_token|token|jwt)":\s*"(?:|text|password|passwd|email|tel|url|search|number|range|hidden|checkbox|radio|date|datetime|datetime-local|month|week|time|color|file|submit|reset|button|image|string|boolean|object|array|null|true|false|undefined|none|off|on|auto|current-password|new-password|one-time-code|username|webauthn|changeme|placeholder|example|sample|dummy|yourpassword|your_password|xxx+|\*{2,}|•{2,}|\.{3,}|_{2,}|-{2,})"'

    extractors:
      - type: regex
        name: leaked_data
        regex:
          # JSON/JavaScript password fields
          - '"password":\s*"([^"]*)"'
          - '"passwd":\s*"([^"]*)"'
          - '"pwd":\s*"([^"]*)"'
          - '"pass":\s*"([^"]*)"'
          - '"password_hash":\s*"([^"]*)"'
          - '"password_digest":\s*"([^"]*)"'
          - '"encrypted_password":\s*"([^"]*)"'
          - '"user_password":\s*"([^"]*)"'
          - '"db_password":\s*"([^"]*)"'
          - '"database_password":\s*"([^"]*)"'
          - '"admin_password":\s*"([^"]*)"'
          - '"root_password":\s*"([^"]*)"'
          - '"api_key":\s*"([^"]*)"'
          - '"secret_key":\s*"([^"]*)"'
          - '"access_token":\s*"([^"]*)"'
          - '"refresh_token":\s*"([^"]*)"'
          - '"auth_token":\s*"([^"]*)"'
          - '"session_token":\s*"([^"]*)"'
          - '"bearer_token":\s*"([^"]*)"'
          - '"jwt":\s*"([^"]*)"'
          - '"private_key":\s*"([^"]*)"'
          - '"secret":\s*"([^"]*)"'
          - '"recover_passw":\s*"([^"]*)"'
          - '"recovery_token":\s*"([^"]*)"'
          - '"reset_token":\s*"([^"]*)"'
          - '"hash":\s*"([^"]*)"'
          - '"md5":\s*"([^"]*)"'
          - '"sha1":\s*"([^"]*)"'
          - '"sha256":\s*"([^"]*)"'
          - '"bcrypt":\s*"([^"]*)"'
          
          # Key-value formats
          - '[?&]password=([a-zA-Z0-9_%!@#$^*+=\-]{3,})[&\s"''<]'
          - '[?&]passwd=([a-zA-Z0-9_%!@#$^*+=\-]{3,})[&\s"''<]'
          - '[?&]pwd=([a-zA-Z0-9_%!@#$^*+=\-]{3,})[&\s"''<]'
          - '[?&]pass=([a-zA-Z0-9_%!@#$^*+=\-]{3,})[&\s"''<]'
          - '[?&]api_key=([a-zA-Z0-9_%!@#$^*+=\-]{3,})[&\s"''<]'
          - '[?&]apikey=([a-zA-Z0-9_%!@#$^*+=\-]{3,})[&\s"''<]'
          - '[?&]secret=([a-zA-Z0-9_%!@#$^*+=\-]{3,})[&\s"''<]'
          
          # Database connection strings - extract password part
          - 'pg_connect\([^)]*password=([^\s;)"]+)'
          - 'mysql_connect\([^)]*,\s*"([^"]+)"\s*,\s*"([^"]+)"'
          - 'mysqli_connect\([^)]*,\s*"([^"]+)"\s*,\s*"([^"]+)"'
          - 'mongodb:\/\/[^:]+:([^@]+)@'
          - 'postgres:\/\/[^:]+:([^@]+)@'
          - 'mysql:\/\/[^:]+:([^@]+)@'
          - 'jdbc:[^:]+:\/\/[^:]+:([^@]+)@'
          - 'Password=([^;]+);'
          - 'pwd=([^;]+);'
          
          # XML formats
          - '<password>([^<]+)<\/password>'
          - '<passwd>([^<]+)<\/passwd>'
          - '<hash>([^<]+)<\/hash>'
          - '<apiKey>([^<]+)<\/apiKey>'
          - '<secret>([^<]+)<\/secret>'
          
          # YAML/Configuration formats
          - 'password:\s+"([^"]{3,})"'
          - "password:\\s+'([^']{3,})'"
          - 'passwd:\s+"([^"]{3,})"'
          - "passwd:\\s+'([^']{3,})'"
          - 'api_key:\s+"([^"]{3,})"'
          - "api_key:\\s+'([^']{3,})'"
          - 'secret:\s+"([^"]{3,})"'
          - "secret:\\s+'([^']{3,})'"
          
          # Environment variables
          - '(?:^|export\s+|set\s+)PASSWORD=([^\s\n]+)'
          - '(?:^|export\s+|set\s+)PASSWD=([^\s\n]+)'
          - '(?:^|export\s+|set\s+)API_KEY=([^\s\n]+)'
          - '(?:^|export\s+|set\s+)SECRET=([^\s\n]+)'
          - '(?:^|export\s+|set\s+)DB_PASSWORD=([^\s\n]+)'
          - '(?:^|export\s+|set\s+)DATABASE_PASSWORD=([^\s\n]+)'
          
          # PHP serialize
          - 's:\d+:"password";s:\d+:"([^"]+)"'
          - 's:\d+:"hash";s:\d+:"([^"]+)"'
