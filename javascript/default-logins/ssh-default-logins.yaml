id: ssh-default-logins

info:
  name: SSH - Default Logins
  author: tarunKoyalwar
  severity: critical
  metadata:
    max-request: 223
    shodan-query: port:22
  tags: js,ssh,default-login,network,fuzz

javascript:
  - pre-condition: |
      var m = require("nuclei/ssh");
      // Extract host and port from Hostname (format: host:port)
      var hostParts = Hostname.split(":");
      var Host = hostParts[0];
      var Port = hostParts.length > 1 ? parseInt(hostParts[1], 10) : 22;
      var c = m.SSHClient();
      var response = c.ConnectSSHInfoMode(Host, Port);
      // only bruteforce if ssh allows password based authentication
      response["UserAuth"].includes("password")

    code: |
      var m = require("nuclei/ssh");
      var c = m.SSHClient();
      c.Connect(Host,Port,Username,Password);

    args:
      Host: "{{Host}}"
      Hostname: "{{Hostname}}"
      Username: "{{username}}"
      Password: "{{password}}"

    threads: 20

    attack: clusterbomb
    payloads:
      username: helpers/wordlists/small-users.txt
      password: helpers/wordlists/small-passwords.txt
      
    matchers:
      - type: dsl
        dsl:
          - "response == true"
          - "success == true"
        condition: and
