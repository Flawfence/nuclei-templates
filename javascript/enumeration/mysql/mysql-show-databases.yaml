id: mysql-show-databases

info:
  name: MySQL - Show Databases
  author: DhiyaneshDk
  severity: high
  description : |
    MySQL servers was identified with weak authentication credentials. When default or commonly used username/password combinations (root, admin, mysql, test) allow successful authentication, the server is vulnerable to unauthorized access. The command "show databases" was executed and permited to enumerate all databases on the target system.
  reference:
    - https://nmap.org/nsedoc/scripts/mysql-databases.html
  metadata:
    verified: true
    max-request: 16
    shodan-query: "port:3306"
  tags: js,mysql,network,enum,discovery
javascript:
  - pre-condition: |
      // Extract host and port from Hostname (format: host:port)
      var hostParts = Hostname.split(":");
      var Host = hostParts[0];
      var Port = hostParts.length > 1 ? parseInt(hostParts[1], 10) : 3306;
      isPortOpen(Host,Port);
    code: |
      let m = require('nuclei/mysql');
      let c = m.MySQLClient();
      let response = c.ExecuteQuery(Host,Port,User,Pass,Query);
      Export(response);

    args:
      Host: "{{Host}}"
      Hostname: "{{Hostname}}"
      Query: "show databases;"
      User: "{{usernames}}"
      Pass: "{{passwords}}"

    payloads:
      usernames:
        - root
        - admin
        - mysql
        - test
      passwords:
        - root
        - admin
        - mysql
        - test
    attack: clusterbomb

    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - "success == true"

    extractors:
      - type: json
        part: response
        json:
          - .Rows[] | .Database
