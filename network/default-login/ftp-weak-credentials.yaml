id: ftp-weak-credentials

info:
  name: FTP Service - Credential Weakness
  author: Flawfence
  severity: high
  description: |
    An FTP service was accessed with easily guessed credentials.
  reference:
    - https://docs.microsoft.com/en-us/iis/configuration/system.applicationhost/sites/sitedefaults/ftpserver/security/authentication/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:L/A:N
    cvss-score: 8.5
  metadata:
    max-request: 1
  tags: network,ftp,default-login,service,javascript

javascript:
  - code: |
      var net = require("nuclei/net");

      // Extract host and port from Hostname (format: host:port)
      var hostParts = Hostname.split(":");
      var Host = hostParts[0];
      var Port = hostParts.length > 1 ? parseInt(hostParts[1], 10) : 21;
      var conn = net.Open("tcp", Host + ":" + Port);

      if (!conn) {
        throw new Error("Failed to connect to " + Host + ":" + Port);
      }

      // Read banner and wait for it
      var banner = conn.Recv();
      
      // Send username and wait for response
      conn.Send("USER " + Username + "\r\n");
      var userResponse = conn.Recv();
      
      // Send password and wait for response
      conn.Send("PASS " + Password + "\r\n");
      var passResponse = conn.Recv();
      
      conn.Close();

      // Return the password response for matching
      passResponse;

    args:
      Host: "{{Host}}"
      Hostname: "{{Hostname}}"
      Username: "{{username}}"
      Password: "{{password}}"

    threads: 1    # Wait for each connection to complete before starting a new one
    
    attack: clusterbomb
    payloads:
      username: helpers/wordlists/small-users.txt
      password: helpers/wordlists/small-passwords.txt

    matchers:
      - type: word
        words:
          - "230 Login successful"
          - "230 User logged in"
          - "230-"

