id: telnet-detect

info:
  name: Telnet Service - Detect
  author: pussycat0x,Flawfence
  severity: high
  description: |
    Detects Telnet services on the port specified in the input file (host:port).
    Telnet transmits all data including credentials in cleartext.
  reference:
    - https://www.rfc-editor.org/rfc/rfc854
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
  tags: network,telnet,detect,detection,tcp

javascript:
  - code: |
      var net = require("nuclei/net");

      // Parse host:port from input file
      var parts = Hostname.split(":");
      var host = parts[0];
      var port = parts.length > 1 ? parts[1] : "23";

      log("Connecting to " + host + ":" + port);

      var result = "";
      var conn;
      try {
        conn = net.Open("tcp", host + ":" + port);
      } catch (e) {
        log("Error: " + e);
        Export(result);
      }

      if (conn) {
        try { conn.SetTimeout(8); } catch (e) {}

        // Read banner - single read with enough buffer
        var banner = "";
        try { banner = conn.RecvString(2048); } catch (e) {
          log("RecvString error (will retry): " + e);
        }
        // Retry once if empty (server may be slow)
        if (!banner) {
          try { banner = conn.RecvString(2048); } catch (e) {}
        }

        // Always close, ignore errors
        try { conn.Close(); } catch (e) {}

        if (banner && banner.length > 0) {
          // Detect Telnet IAC bytes (0xFF → U+FFFD in goja JS engine)
          var hasIAC = false;
          for (var i = 0; i < Math.min(banner.length, 64); i++) {
            if (banner.charCodeAt(i) === 0xFFFD) { hasIAC = true; break; }
          }

          var bannerText = banner.replace(/[\x00-\x1f\uFFFD]/g, " ").substring(0, 200).trim();
          var bl = bannerText.toLowerCase();
          var hasKeyword = bl.includes("login:") || bl.includes("username:")
            || bl.includes("telnet") || bl.includes("user access verification")
            || bl.includes("password:");

          var isTelnet = hasIAC || hasKeyword;
          log("Port=" + port + " IAC=" + hasIAC + " Keyword=" + hasKeyword + " Telnet=" + isTelnet + " Banner=" + bannerText.substring(0, 60));

          if (isTelnet) {
            result = "TELNET host=" + host + " port=" + port + " banner=" + bannerText;
          }
        } else {
          log("No banner received on port " + port);
        }
      }
      Export(result);
      result;

    args:
      Hostname: "{{Hostname}}"

    matchers:
      - type: word
        words:
          - "TELNET host="

    extractors:
      - type: regex
        regex:
          - 'TELNET host=([^\s]+) port=([^\s]+) banner=(.*)'
