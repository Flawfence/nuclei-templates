id: telnet-detect

info:
  name: Telnet Service - Detect
  author: pussycat0x,Flawfence
  severity: high
  description: |
    Detects Telnet services on the port specified in the input file (host:port).
    Telnet transmits all data including credentials in cleartext.
  reference:
    - https://www.rfc-editor.org/rfc/rfc854
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
  tags: network,telnet,detect,detection,tcp

javascript:
  - code: |
      var net = require("nuclei/net");
      var target = Host;

      var parts = target.split(":");
      if (parts.length < 2) return;

      var host = parts[0];
      var port = parseInt(parts[parts.length - 1], 10);
      if (isNaN(port)) return;

      // --- Stagger connections ---
      // Telnet devices (routers, switches) only allow a few concurrent VTY
      // sessions.  When nuclei probes multiple ports in parallel they all
      // race and only one wins; the rest get "connection refused".
      // We add a deterministic delay based on the port number so each
      // probe reaches the device at a different time.
      var delay = ((port * 31) % 11) * 1000;   // 0-10 s spread
      if (delay > 0) {
        var until = new Date().getTime() + delay;
        while (new Date().getTime() < until) {}
      }

      var conn = net.Open("tcp", host + ":" + port);
      if (!conn) return;
      try { conn.SetTimeout(5); } catch (e) {}

      // Read RAW bytes, never RecvString(): the goja engine UTF-8-decodes the
      // string and turns EVERY non-ASCII byte into U+FFFD -- not just the
      // Telnet IAC 0xFF. That made any binary protocol (MySQL handshake,
      // Dovecot, ...) look like it carried IAC bytes => false positives.
      // Recv() returns the bytes untouched (values 0-255).
      function recvBytes(c, n) {
        var out = [];
        try {
          var b = c.Recv(n);
          if (b && b.length) {
            for (var i = 0; i < b.length; i++) out.push(b[i] & 0xff);
          }
        } catch (e) {}
        return out;
      }

      // Telnet is uniquely defined by IAC (255) option negotiation. A valid
      // command is IAC followed by WILL/WONT/DO/DONT (251-254) + a real telnet
      // option byte (0-49 cover every standard option, up to KERMIT/47), or
      // IAC + a command in the 240-250 range (SB/SE/NOP/DM/...).
      // IAC IAC (255 255) is an escaped *data* byte, not a command -> ignored.
      // Requiring this exact structure (not a lone 0xFF) rejects binary
      // protocols that merely happen to contain 0xFF bytes.
      function telnetNegotiations(bytes) {
        var hits = 0;
        for (var i = 0; i + 1 < bytes.length; i++) {
          if (bytes[i] !== 255) continue;
          var cmd = bytes[i + 1];
          if (cmd >= 251 && cmd <= 254) {          // WILL WONT DO DONT
            var opt = (i + 2 < bytes.length) ? bytes[i + 2] : -1;
            if (opt >= 0 && opt <= 49) { hits++; i += 2; }   // real option
          } else if (cmd >= 240 && cmd <= 250) {   // SB SE NOP DM BRK IP ...
            hits++; i += 1;
          }
          // cmd === 255 -> escaped IAC data byte, not a command, skip
        }
        return hits;
      }

      var raw = recvBytes(conn, 512);

      // A genuine Telnet server opens with a *block* of negotiations (several
      // IAC commands back to back). Requiring >= 2 well-formed negotiations
      // rejects binary protocols (e.g. a MySQL handshake) that may contain one
      // coincidental IAC-like byte pair.
      var confirmed = telnetNegotiations(raw) >= 2;

      // A real Telnet server's first byte is IAC (0xFF). Line-oriented services
      // greet with a printable-ASCII status banner instead: FTP/SMTP "220 ...",
      // POP3 "+OK", IMAP "* OK", SSH "SSH-2.0", HTTP "HTTP/". Crucially, the FTP
      // and SMTP *control* channels are themselves Telnet-based (RFC 959 / RFC
      // 821), so they faithfully answer our IAC DO STATUS probe with IAC WONT --
      // which made the active probe report every FTP/SMTP/mail server as Telnet.
      // If the server already greeted us in ASCII it is a line protocol, never
      // Telnet, so we must not probe it.
      function hasAsciiGreeting(bytes) {
        return bytes.length > 0 && bytes[0] >= 0x20 && bytes[0] <= 0x7e;
      }

      // Only actively probe a silent / binary-leading port (no ASCII greeting):
      // IAC DO STATUS (FF FD 05). Per RFC 854 a real Telnet server MUST answer
      // with IAC WILL/WONT 05; a truly silent telnetd reveals itself only when
      // prompted. We deliberately skip this for ASCII-greeting servers because
      // FTP/SMTP would answer the IAC and be misclassified as Telnet.
      if (!confirmed && !hasAsciiGreeting(raw)) {
        try { conn.SendHex("fffd05"); } catch (e) {}
        var resp = recvBytes(conn, 256);
        if (telnetNegotiations(resp) >= 1) confirmed = true;
        for (var k = 0; k < resp.length; k++) raw.push(resp[k]);
      }

      try { conn.Close(); } catch (e) {}

      // Not a Telnet IAC speaker == not Telnet. Eliminates the MySQL, Dovecot,
      // SMTP, SSH, HTTP, ... false positives.
      if (!confirmed) return;
      var hits = telnetNegotiations(raw);

      // Readable banner from the printable bytes only.
      var banner = "";
      for (var j = 0; j < raw.length; j++) {
        var ch = raw[j];
        banner += (ch >= 0x20 && ch <= 0x7e) ? String.fromCharCode(ch) : " ";
      }
      banner = banner.replace(/\s+/g, " ").substring(0, 200).trim();

      var result = {
        "host": host,
        "port": port,
        "telnet": true,
        "iac_negotiations": hits,
        "banner": banner
      };
      Export(result);
      to_json(result);

    args:
      Host: "{{Hostname}}"

    matchers:
      - type: dsl
        dsl:
          - 'contains(response, "telnet:true")'

    extractors:
      - type: dsl
        dsl:
          - 'response'
