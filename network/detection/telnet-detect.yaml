id: telnet-detect

info:
  name: Telnet Service - Detect
  author: pussycat0x,Flawfence
  severity: high
  description: |
    Detects Telnet services on the port specified in the input file (host:port).
    Telnet transmits all data including credentials in cleartext.
  reference:
    - https://www.rfc-editor.org/rfc/rfc854
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
  tags: network,telnet,detect,detection,tcp

javascript:
  - code: |
      var net = require("nuclei/net");
      var target = Host;

      var parts = target.split(":");
      if (parts.length < 2) return;

      var host = parts[0];
      var port = parseInt(parts[parts.length - 1], 10);
      if (isNaN(port)) return;

      // --- Stagger connections ---
      // Telnet devices (routers, switches) only allow a few concurrent VTY
      // sessions.  When nuclei probes multiple ports in parallel they all
      // race and only one wins; the rest get "connection refused".
      // We add a deterministic delay based on the port number so each
      // probe reaches the device at a different time.
      var delay = ((port * 31) % 11) * 1000;   // 0-10 s spread
      if (delay > 0) {
        var until = new Date().getTime() + delay;
        while (new Date().getTime() < until) {}
      }

      var conn = net.Open("tcp", host + ":" + port);
      if (!conn) return;

      // Two-pass read: first grab IAC bytes (sent immediately), then the
      // login banner which may arrive in a later TCP segment.
      var banner = "";
      try { banner = conn.RecvString(64); } catch (e) {}
      try { banner += conn.RecvString(256); } catch (e) {}
      try { conn.Close(); } catch (e) {}

      if (!banner || banner.length === 0) return;

      // Detect Telnet IAC bytes (0xFF → U+FFFD in goja engine)
      var hasIAC = false;
      for (var i = 0; i < Math.min(banner.length, 64); i++) {
        if (banner.charCodeAt(i) === 0xFFFD) { hasIAC = true; break; }
      }

      var clean = banner.replace(/[\x00-\x1f\uFFFD]/g, " ").substring(0, 200).trim();
      var low = clean.toLowerCase();
      var hasKW = low.includes("login:") || low.includes("username:")
        || low.includes("telnet") || low.includes("user access verification")
        || low.includes("password:");

      if (!hasIAC && !hasKW) return;

      var result = {
        "host": host,
        "port": port,
        "iac": hasIAC,
        "banner": clean
      };
      Export(result);
      to_json(result);

    args:
      Host: "{{Hostname}}"

    matchers:
      - type: dsl
        dsl:
          - 'len(response) > 0'

    extractors:
      - type: dsl
        dsl:
          - 'response'
