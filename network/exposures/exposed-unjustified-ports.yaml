id: exposed-unjustified-ports

info:
  name: Exposed Unjustified Ports Detection
  author: Flawfence
  severity: medium
  description: |
    Detects services running on non-standard/unjustified ports by reading a list of IP:PORT combinations,
    attempting to connect to each port, and identifying services running on unexpected ports.
    This helps identify potential security misconfigurations or backdoors.
  tags: network,exposure,ports,misconfiguration
  reference:
    - https://www.iana.org/assignments/service-names-port-numbers/service-names-port-numbers.xhtml

variables:
  ports_file: "/app/results/nuclei/nmap-nuclei-targets.txt"

javascript:
  - code: |
      var net = require("nuclei/net");
      
      log("Processing target: " + target);
      
      // Parse the target (format: host:port)
      var parts = target.split(":");
      if (parts.length < 2) {
        log("Invalid format: " + target);
        return;
      }
      
      var host = parts[0];
      var port = parseInt(parts[parts.length - 1], 10);
      
      log("Parsed - Host: " + host + ", Port: " + port);
      
      // Skip standard HTTP ports
      if (isNaN(port) || port === 80 || port === 443 || port === 8080 || port === 8443) {
        log("Skipping standard port: " + port);
        return;
      }
      
      log("Connecting to " + host + ":" + port);
      
      var conn = net.Open("tcp", host + ":" + port);
      if (!conn) {
        log("Failed to connect");
        return;
      }
      
      log("Connected! Reading banner...");
      
      var banner = conn.RecvString(1024);
      conn.Close();
      
      if (!banner) {
        log("No banner received");
        return;
      }
      
      log("Banner received: " + banner.substring(0, 50));
      
      var service = "unknown";
      var b = banner.toLowerCase();
      
      if (b.includes("ssh")) service = "SSH";
      else if (b.includes("ftp")) service = "FTP";
      else if (b.includes("smtp")) service = "SMTP";
      else if (b.includes("mysql")) service = "MySQL";
      else if (b.includes("postgresql")) service = "PostgreSQL";
      else if (b.includes("mongodb")) service = "MongoDB";
      else if (b.includes("redis")) service = "Redis";
      else if (b.includes("http")) service = "HTTP";
      
      log("Identified service: " + service);
      
      var result = {
        "host": host, 
        "port": port, 
        "service": service, 
        "banner": banner.substring(0, 100).replace(/[\r\n]+/g, " ")
      };
      Export(result);
      
      log(result);
      to_json(result);


    args:
      Host: "{{Host}}"
      Port: 443
      target: "{{target}}"
      
    attack: batteringram
    payloads:
      target: /app/results/nuclei/nmap-nuclei-targets.txt

    matchers:
      - type: dsl
        dsl:
          - 'len(response) > 0'
    
    extractors:
      - type: dsl
        dsl:
          - 'response'
